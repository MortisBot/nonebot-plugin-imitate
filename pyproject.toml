[project]
name = "nonebot-plugin-imitate"
version = "0.1.0"
description = "Replay / Markov group imitation plugin for NoneBot2 (OneBot v11)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.5,<3",
    "nonebot-adapter-onebot>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "nonebot2[fastapi]>=2.5,<3"]

[project.urls]
Homepage = "https://github.com/MortisBot/nonebot-plugin-imitate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_imitate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
